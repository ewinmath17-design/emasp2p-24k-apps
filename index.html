<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmasP2P - Platform Marketplace Emas Antam 24K</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & React DOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone untuk kompilasi JSX langsung di browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: sans-serif; }
        .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>

    <!-- Container Root React -->
    <div id="root"></div>

    <!-- Script Aplikasi EmasP2P -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Base price gramasi 0.5g sampai 1kg (Data Simulasi Live Antam)
        const BASE_PRICES = [
            { id: '0.5g', weight: 0.5, sell: 1347500, buy: 1202500 },
            { id: '1g', weight: 1, sell: 2595000, buy: 2405000 },
            { id: '2g', weight: 2, sell: 5130000, buy: 4810000 },
            { id: '3g', weight: 3, sell: 7670000, buy: 7215000 },
            { id: '5g', weight: 5, sell: 12750000, buy: 12025000 },
            { id: '10g', weight: 10, sell: 25445000, buy: 24050000 },
            { id: '25g', weight: 25, sell: 63487000, buy: 60125000 },
            { id: '50g', weight: 50, sell: 126895000, buy: 120250000 },
            { id: '100g', weight: 100, sell: 253712000, buy: 240500000 },
            { id: '250g', weight: 250, sell: 634015000, buy: 601250000 },
            { id: '500g', weight: 500, sell: 1267820000, buy: 1202500000 },
            { id: '1000g', weight: 1000, sell: 2535600000, buy: 2405000000 }
        ];

        const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);

        function App() {
            const [prices, setPrices] = useState(BASE_PRICES);
            const [selectedWeight, setSelectedWeight] = useState(BASE_PRICES[1]);
            const [listings, setListings] = useState([
                { id: 1, seller: 'Eko_Antam_Kdi', weight: '10g', grammage: 10, year: 2024, cert: 'A89123', price: 24750000, rating: 4.9, location: 'Kendari' },
                { id: 2, seller: 'GoldVault_Jkt', weight: '1g', grammage: 1, year: 2025, cert: 'B77211', price: 2500000, rating: 5.0, location: 'Jakarta' },
                { id: 3, seller: 'Mulia_Store_Sby', weight: '5g', grammage: 5, year: 2023, cert: 'C10293', price: 12380000, rating: 4.8, location: 'Surabaya' }
            ]);

            const [newWeight, setNewWeight] = useState('1g');
            const [newPrice, setNewPrice] = useState(2500000);
            const [activeEscrow, setActiveEscrow] = useState(null);
            const [escrowStep, setEscrowStep] = useState(1);

            // Live Price Fluctuation Simulation (Tiapan 5 Detik)
            useEffect(() => {
                const interval = setInterval(() => {
                    setPrices(prev => prev.map(p => {
                        const delta = (Math.random() - 0.48) * (p.sell * 0.001);
                        return {
                            ...p,
                            sell: Math.round(p.sell + delta),
                            buy: Math.round(p.buy + delta)
                        };
                    }));
                }, 5000);
                return () => clearInterval(interval);
            }, []);

            const currentPriceData = prices.find(p => p.id === newWeight) || prices[1];
            const fairP2PPrice = Math.round((currentPriceData.sell + currentPriceData.buy) / 2);

            const handleCreateListing = (e) => {
                e.preventDefault();
                const selectedObj = prices.find(p => p.id === newWeight);
                const item = {
                    id: Date.now(),
                    seller: 'Saya (Verified)',
                    weight: newWeight,
                    grammage: selectedObj.weight,
                    year: 2026,
                    cert: 'M' + Math.floor(10000 + Math.random() * 90000),
                    price: Number(newPrice),
                    rating: 5.0,
                    location: 'Kendari'
                };
                setListings([item, ...listings]);
                alert('Listing Emas Berhasil Ditambahkan!');
            };

            const triggerCheckout = (listing) => {
                setActiveEscrow(listing);
                setEscrowStep(1);
            };

            return (
                <div className="min-h-screen pb-12">
                    {/* Header Nav */}
                    <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center font-bold text-slate-950 text-xl shadow-lg">E</div>
                                <span className="text-xl font-bold tracking-tight">Emas<span className="gold-text">P2P</span></span>
                            </div>
                            <div className="flex items-center space-x-4">
                                <span className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-3 py-1 rounded-full flex items-center gap-1.5 font-medium">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live Market Feed
                                </span>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 pt-8 space-y-8">

                        {/* Banner Spread Hero */}
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 relative overflow-hidden">
                            <div className="max-w-2xl relative z-10 space-y-4">
                                <span className="text-amber-400 text-sm font-semibold uppercase tracking-wider">Win-Win Solution Marketplace</span>
                                <h1 className="text-3xl md:text-4xl font-extrabold leading-tight">Transaksi Emas Antam 24K Langsung Antar Pengguna</h1>
                                <p className="text-slate-400 text-sm leading-relaxed">
                                    Dapatkan harga paling adil tepat di tengah-tengah spread Antam resmi. Penjual dapet lebih tinggi dari harga <i className="text-slate-200">buyback</i>, pembeli dapet lebih murah dari toko resmi!
                                </p>
                            </div>
                        </div>

                        {/* Table Live Prices 0.5g - 1kg */}
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                                📊 Harga Emas Antam Resmi Real-Time
                            </h2>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-800/50 text-slate-400 uppercase text-xs">
                                        <tr>
                                            <th className="p-3">Gramasi</th>
                                            <th className="p-3">Harga Toko (Jual)</th>
                                            <th className="p-3">Harga Buyback (Beli)</th>
                                            <th className="p-3 text-amber-400">Rekomendasi P2P</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {prices.map(p => (
                                            <tr key={p.id} className="hover:bg-slate-800/30">
                                                <td className="p-3 font-semibold text-slate-200">{p.id} ({p.weight} gram)</td>
                                                <td className="p-3 text-rose-400 font-mono">{formatIDR(p.sell)}</td>
                                                <td className="p-3 text-emerald-400 font-mono">{formatIDR(p.buy)}</td>
                                                <td className="p-3 text-amber-400 font-mono font-bold">{formatIDR(Math.round((p.sell + p.buy) / 2))}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Marketplace Listings & Form Buat Listing */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            
                            {/* Listing Pasar */}
                            <div className="lg:col-span-2 space-y-4">
                                <h2 className="text-lg font-bold flex items-center gap-2">
                                    🛍️ Marketplace Listing Aktif
                                </h2>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {listings.map(item => (
                                        <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <span className="text-xs text-amber-400 font-bold bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/20">Antam CertiCard</span>
                                                    <h3 className="text-xl font-bold mt-1">{item.weight} ({item.year})</h3>
                                                </div>
                                                <span className="text-xs bg-slate-800 px-2 py-1 rounded text-slate-400">{item.location}</span>
                                            </div>

                                            <div className="text-xs text-slate-400 space-y-1">
                                                <p>Penjual: <span className="text-slate-200 font-medium">{item.seller}</span> ({item.rating}★)</p>
                                                <p>No Seri: <span className="font-mono text-slate-300">{item.cert}</span></p>
                                            </div>

                                            <div className="pt-2 border-t border-slate-800 flex justify-between items-center">
                                                <div>
                                                    <div className="text-xs text-slate-500">Harga P2P</div>
                                                    <div className="text-lg font-bold text-amber-400 font-mono">{formatIDR(item.price)}</div>
                                                </div>
                                                <button 
                                                    onClick={() => triggerCheckout(item)}
                                                    className="gold-gradient text-slate-950 font-bold px-4 py-2 rounded-lg text-sm hover:opacity-90">
                                                    Beli Via Escrow
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Form Jual Emas */}
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 h-fit">
                                <h2 className="text-lg font-bold flex items-center gap-2">
                                    ➕ Buat Listing Penjual
                                </h2>

                                <form onSubmit={handleCreateListing} className="space-y-4">
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Pilih Gramasi</label>
                                        <select 
                                            value={newWeight} 
                                            onChange={(e) => {
                                                setNewWeight(e.target.value);
                                                const pObj = prices.find(p => p.id === e.target.value);
                                                setNewPrice(Math.round((pObj.sell + pObj.buy) / 2));
                                            }}
                                            className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm font-medium">
                                            {prices.map(p => (
                                                <option key={p.id} value={p.id}>{p.id} ({p.weight}g)</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="bg-slate-800/50 p-3 rounded-lg text-xs space-y-1 border border-slate-700">
                                        <div className="flex justify-between"><span>Harga Buyback Toko:</span> <span className="text-emerald-400">{formatIDR(currentPriceData.buy)}</span></div>
                                        <div className="flex justify-between"><span>Harga Jual Toko:</span> <span className="text-rose-400">{formatIDR(currentPriceData.sell)}</span></div>
                                        <div className="flex justify-between font-bold pt-1 border-t border-slate-700 text-amber-400"><span>Rekomendasi P2P:</span> <span>{formatIDR(fairP2PPrice)}</span></div>
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Harga Jual Kamu (IDR)</label>
                                        <input 
                                            type="number" 
                                            value={newPrice} 
                                            onChange={(e) => setNewPrice(e.target.value)}
                                            className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm font-mono font-bold text-amber-400"
                                        />
                                    </div>

                                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-sm transition">
                                        Tayangkan Listing Sekarang
                                    </button>
                                </form>
                            </div>

                        </div>
                    </main>

                    {/* Escrow Modal Simulation */}
                    {activeEscrow && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-5">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="font-bold text-lg">🛡️ Rekening Bersama (Escrow)</h3>
                                    <button onClick={() => setActiveEscrow(null)} className="text-slate-400 hover:text-white">✕</button>
                                </div>

                                {escrowStep === 1 && (
                                    <div className="space-y-4">
                                        <p className="text-sm text-slate-300">Anda akan membeli <b className="text-amber-400">{activeEscrow.weight} Antam</b> seharga <b className="font-mono text-amber-400">{formatIDR(activeEscrow.price)}</b>.</p>
                                        <div className="bg-slate-800/50 p-3 rounded-lg text-xs text-slate-400">
                                            Dana akan dikunci di Escrow EmasP2P dan HANYA dilepas ke penjual setelah emas fisik Anda terima & verifikasi.
                                        </div>
                                        <button onClick={() => setEscrowStep(2)} className="w-full gold-gradient text-slate-950 font-bold py-3 rounded-xl">
                                            Konfirmasi & Lock Dana Escrow
                                        </button>
                                    </div>
                                )}

                                {escrowStep === 2 && (
                                    <div className="space-y-4 text-center py-4">
                                        <div className="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-2xl font-bold animate-bounce">✓</div>
                                        <h4 className="font-bold text-lg">Dana Berhasil Diamankan!</h4>
                                        <p className="text-xs text-slate-400">Penjual (<b className="text-slate-200">{activeEscrow.seller}</b>) telah dinotifikasi untuk mengirimkan emas fisik via kurir asuransi.</p>
                                        <button onClick={() => setActiveEscrow(null)} className="w-full bg-slate-800 hover:bg-slate-700 font-bold py-2.5 rounded-xl text-sm">
                                            Selesai & Tutup
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Mount React ke DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
